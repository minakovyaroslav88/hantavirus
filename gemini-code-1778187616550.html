<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный Virus Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; cursor: crosshair; }
        .info-panel {
            position: absolute; top: 20px; left: 50px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 20px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 280px;
        }
        .instruction { font-size: 0.9em; color: #666; margin-top: 10px; }
        h2 { margin: 0 0 10px 0; color: #b71c1c; font-size: 1.5em; }
    </style>
</head>
<body>

    <div class="info-panel">
        <h2>Virus Tracker</h2>
        <div id="stats">Нажмите на карту, чтобы добавить новый очаг заражения.</div>
        <p class="instruction">Размер круга рассчитается автоматически в зависимости от числа зараженных.</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Инициализация карты
        const map = L.map('map').setView([20, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Функция для отрисовки круга
        function addVirusCircle(lat, lng, name, intensity) {
            const circle = L.circle([lat, lng], {
                color: '#ff0000',
                fillColor: '#f03',
                fillOpacity: 0.5,
                radius: Math.sqrt(intensity) * 600 
            }).addTo(map);

            circle.bindPopup(`<b>${name}</b><br>Заражений: ${Number(intensity).toLocaleString()}`).openPopup();
        }

        // Обработчик клика по карте
        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            const name = prompt("Введите название региона/города:", "Новый очаг");
            if (name) {
                const intensity = prompt("Введите количество зараженных:", "1000");
                if (intensity && !isNaN(intensity)) {
                    addVirusCircle(lat, lng, name, intensity);
                } else {
                    alert("Пожалуйста, введите корректное число.");
                }
            }
        });
    </script>
</body>
</html>
